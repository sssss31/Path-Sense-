# NRSC/ISRO flood hazard zonation polygons (if a vector export is obtained). Hazard classes typically
# "Very Low / Low / Moderate / High / Very High" flood hazard categories.
dataset:
  name: "NRSC Flood Hazard Zonation - Assam"
  slug: nrsc_flood_hazard_assam
  provider: Bhuvan / NDEM
  source_organization: NRSC / ISRO
  source_url: https://bhuvan-app1.nrsc.gov.in/disaster/disaster.php?id=flood_hz
  dataset_version: "<fill from source>"
  license: "<as published by NRSC>"
  attribution: "Flood hazard zonation © NRSC / ISRO (Bhuvan)"
  hazard_category: flood
  data_type: risk_zones
  layer_type: flood_hazard
  provenance_type: historical
  coverage_area: Assam
  coverage_bbox: [89.7, 24.13, 96.02, 27.97]
  period_start: "1998-01-01"
  period_end: "2010-12-31"
  crs: EPSG:4326
  access_method: "Manual: vector export from NRSC/NDEM if provided; otherwise only WMS visualisation is available"
mapping:
  category: [Hazard_Type, hazard, category]
  severity: [Hazard_Cat, Hazard_Class, FHZ_Class, Class, Category]
  description: [District, Remarks, Description]
  external_id: [OBJECTID, FID, id]
transforms:
  category: [strip, lowercase, {name: category_map, default: flood}]
  severity: [{name: susceptibility_map}]
defaults:
  category: flood
required: [geometry, severity]

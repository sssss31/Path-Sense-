# Full stack in containers: `docker compose up --build` then open http://localhost:3000
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smartlogistics
      POSTGRES_USER: smartlogistics
      POSTGRES_PASSWORD: smartlogistics
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlogistics"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["cache"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smartlogistics:smartlogistics@db:5432/smartlogistics
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
